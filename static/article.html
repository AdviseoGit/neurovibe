<!DOCTYPE html>
<html lang="sv" class="bg-[#050505]">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurovibe — Artikel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
    </style>
</head>
<body class="text-[#E0E0E0] min-h-screen flex flex-col p-6 md:p-10">
    <header class="flex justify-between items-center mb-12 md:mb-20 transition-all duration-1000" id="header-ui">
            <button class="flex items-center gap-4 group cursor-pointer text-left" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Neurovibe Hem">
                <div class="relative w-10 h-10 flex items-center justify-center">
                    <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="24" cy="24" r="20" stroke="#D83131" stroke-width="2" opacity="0.6"/>
                        <circle cx="24" cy="24" r="8" fill="#D83131" opacity="0.8" class="animate-pulse"/>
                    </svg>
                </div>
                <span class="text-xl font-semibold tracking-tight">Neuro<span class="opacity-30 font-light">vibe</span></span>
            </button>
            <nav class="hidden md:flex gap-8 text-[10px] font-bold tracking-widest uppercase items-center">
                <a href="#philosophy" class="opacity-50 hover:opacity-100 transition-opacity">Filosofi</a>
                <a href="#lab" class="opacity-50 hover:opacity-100 transition-opacity">Labbet</a>
                <a href="/resurser.html" class="opacity-50 hover:opacity-100 transition-opacity">Verktyg</a>
                <button onclick="toggleZen()" id="zen-btn" class="px-4 py-2 rounded-full border border-white/20 hover:bg-white/5 transition-all text-[9px] tracking-widest">ZEN MODE</button>
                <button onclick="toggleModal('access')" class="bg-white/10 px-4 py-2 rounded-full hover:bg-white/20 transition-all border border-white/10">Få tillgång</button>
            </nav>
            <button id="mobile-menu-btn" class="md:hidden z-50 w-10 h-10 flex flex-col justify-center items-center gap-1.5 relative focus:outline-none" aria-label="Meny">
                <div class="w-6 h-0.5 bg-white transition-transform duration-300 origin-center" id="menu-line-1"></div>
                <div class="w-6 h-0.5 bg-white transition-opacity duration-300" id="menu-line-2"></div>
                <div class="w-6 h-0.5 bg-white transition-transform duration-300 origin-center" id="menu-line-3"></div>
            </button>
            <div id="mobile-menu" class="fixed inset-0 bg-[#050505]/95 backdrop-blur-lg z-40 hidden flex-col items-center justify-center gap-8 text-xl font-semibold opacity-0 transition-opacity duration-300">
                <a href="#philosophy" class="mobile-link hover:text-[#D83131] transition-colors">Filosofi</a>
                <a href="#lab" class="mobile-link hover:text-[#D83131] transition-colors">Labbet</a>
                <a href="/resurser.html" class="mobile-link hover:text-[#D83131] transition-colors">Verktyg</a>
                <button onclick="toggleZen(); toggleMobileMenu();" class="px-6 py-3 rounded-full border border-white/20 hover:bg-white/5 transition-all text-sm tracking-widest">ZEN MODE</button>
                <button onclick="toggleModal('access'); toggleMobileMenu();" class="bg-[#D83131] px-6 py-3 rounded-full hover:bg-[#B72A2A] transition-all text-sm">Få tillgång</button>
            </div>
        </header>
    <main class="max-w-3xl mx-auto w-full glass-panel p-8 md:p-12" id="article-content">
        <div class="animate-pulse">Laddar artikel...</div>
    </main>
    <script>
        async function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const container = document.getElementById('article-content');
            
            if (!id) {
                container.innerHTML = '<p>Artikel saknas.</p>';
                return;
            }

            try {
                const res = await fetch('/api/posts');
                let posts = await res.json();
                if (!posts) posts = [];
                
                posts.push({
                    id: "hardcoded-1",
                    title: "Neurodiversitet och AI: Hur vi anpassar framtidens arbetsplats 2026",
                    date: "2026-04-14",
                    category: "Arbetsplats 2026",
                    content: "I takt med att artificiell intelligens fortsätter att revolutionera hur vi arbetar, står framtidens arbetsplats inför en ny utmaning: att skapa miljöer som fullt ut stödjer neurodiversitet. Läs vår senaste rapport om hur AI-anpassade arbetsflöden skapar en mer inkluderande och kognitivt skonsam arbetsmiljö. Detta är ett avgörande steg för att bygga hållbara företag där alla kan trivas och bidra med sina unika perspektiv."
                });
                
                const article = posts.find(p => String(p.id) === id);
                if (article) {
                    container.innerHTML = `
                        <span class="text-[9px] font-bold text-[#D83131] uppercase tracking-widest">${article.category || 'Allmänt'} — ${article.date}</span>
                        <h1 class="text-3xl md:text-5xl font-bold mt-4 mb-8 text-white">${article.title}</h1>
                        <div class="text-[#A0A0A0] text-lg leading-relaxed whitespace-pre-wrap">${article.content}</div>
                        <a href="/" class="mt-12 inline-block px-6 py-3 border border-white/20 rounded-full hover:bg-white/5 transition-all text-sm font-semibold">Tillbaka</a>
                    `;
                } else {
                    container.innerHTML = '<p>Artikel hittades inte.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p>Kunde inte ladda artikeln.</p>';
            }
        }
        loadArticle();
    </script>

    <script>
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        let isMobileMenuOpen = false;

        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            const line1 = document.getElementById("menu-line-1");
            const line2 = document.getElementById("menu-line-2");
            const line3 = document.getElementById("menu-line-3");

            if (isMobileMenuOpen) {
                mobileMenu.classList.remove("hidden");
                setTimeout(() => mobileMenu.classList.remove("opacity-0"), 10);
                document.body.style.overflow = "hidden";
                if(line1) line1.classList.add("translate-y-2", "rotate-45");
                if(line2) line2.classList.add("opacity-0");
                if(line3) line3.classList.add("-translate-y-2", "-rotate-45");
            } else {
                mobileMenu.classList.add("opacity-0");
                setTimeout(() => mobileMenu.classList.add("hidden"), 300);
                document.body.style.overflow = "";
                if(line1) line1.classList.remove("translate-y-2", "rotate-45");
                if(line2) line2.classList.remove("opacity-0");
                if(line3) line3.classList.remove("-translate-y-2", "-rotate-45");
            }
        }
        if (mobileMenuBtn) mobileMenuBtn.addEventListener("click", toggleMobileMenu);
        document.querySelectorAll(".mobile-link").forEach(l => l.addEventListener("click", toggleMobileMenu));
    </script>
</body>
</html>
