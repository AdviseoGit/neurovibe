        <main class="glass-panel p-8 md:p-12 mb-16">

            </div>

            <div class="space-y-6">
                <div class="relative">
                    <input type="text" id="task-input" 
                        class="w-full glass-panel bg-white/[0.04] border-white/10 px-6 py-5 rounded-2xl outline-none text-lg font-light transition-all input-glow" 
                        placeholder="T.ex. 'Gör klart månadens rapport...'"
                        autocomplete="off">
                </div>
                
                <button id="breakdown-btn" class="w-full bg-[#D83131] text-white py-4 rounded-xl font-bold hover:bg-[#B72A2A] transition-all shadow-lg shadow-[#D83131]/20">
                    Gör det hanterbart
                </button>
            </div>

            <div id="loading" class="hidden text-center mt-12 opacity-50">
                <p class="animate-pulse tracking-widest uppercase text-sm">Analyserar friktionen...</p>
            </div>

            <div id="result-container" class="mt-12 hidden">
                <h3 class="text-xl font-semibold mb-6">Din mikro-plan:</h3>
                <div id="result-content" class="result-list">
                    <!-- Results injected here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const btn = document.getElementById('breakdown-btn');
        const input = document.getElementById('task-input');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('result-container');
        const resultContent = document.getElementById('result-content');

        async function handleBreakdown() {
            const task = input.value.trim();
            if(!task) return;

            btn.disabled = true;
            resultContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const response = await fetch('/api/breakdown', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: task })
                });
                
                const data = await response.json();
                
                loading.classList.add('hidden');
                resultContent.innerHTML = data.response;
                resultContainer.classList.remove('hidden');
            } catch (err) {
                loading.classList.add('hidden');
                resultContent.innerHTML = "<p class='text-[#D83131]'>Ett fel uppstod. Prova igen.</p>";
                resultContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        }

        btn.addEventListener('click', handleBreakdown);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleBreakdown(); });
    </script>

    <script>
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        let isMobileMenuOpen = false;

        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            const line1 = document.getElementById("menu-line-1");
            const line2 = document.getElementById("menu-line-2");
            const line3 = document.getElementById("menu-line-3");

            if (isMobileMenuOpen) {
                mobileMenu.classList.remove("hidden");
                setTimeout(() => mobileMenu.classList.remove("opacity-0"), 10);
                document.body.style.overflow = "hidden";
                if(line1) line1.classList.add("translate-y-2", "rotate-45");
                if(line2) line2.classList.add("opacity-0");
                if(line3) line3.classList.add("-translate-y-2", "-rotate-45");
            } else {
                mobileMenu.classList.add("opacity-0");
                setTimeout(() => mobileMenu.classList.add("hidden"), 300);
                document.body.style.overflow = "";
                if(line1) line1.classList.remove("translate-y-2", "rotate-45");
                if(line2) line2.classList.remove("opacity-0");
                if(line3) line3.classList.remove("-translate-y-2", "-rotate-45");
            }
        }
        if (mobileMenuBtn) mobileMenuBtn.addEventListener("click", toggleMobileMenu);
        document.querySelectorAll(".mobile-link").forEach(l => l.addEventListener("click", toggleMobileMenu));
    </script>
